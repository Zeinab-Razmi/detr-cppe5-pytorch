# ╔══════════════════════════════════════════════════════════════╗
# ║  Single project configuration                                ║
# ║  model_choice: "detr" or "conditional_detr"                  ║
# ╚══════════════════════════════════════════════════════════════╝
model_choice: detr

seed: 1337                      # data split seed

data:
  dataset: danelcsb/cppe-5-v2   # Hugging Face hub id, or a local folder saved with DatasetDict.save_to_disk
  image_size: 480
  val_ratio: 0.15               # only used when the dataset has no "validation" split
  stratify_priority: [Goggles, Face_Shield, Coverall, Mask, Gloves]
  stratify_fallback: Gloves     # majority class, for images without boxes
  num_workers: 2

train:
  seed: 42                      # training seed
  epochs: 30
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_steps: 0
  max_grad_norm: 0.01
  gradient_accumulation_steps: 1
  log_every_n_steps: 20
  metric_for_best_model: map
  greater_is_better: true
  early_stopping_patience: null

evaluation:
  threshold: 0.0
  use_nms: false

inference:
  image: https://images.pexels.com/photos/8413299/pexels-photo-8413299.jpeg?auto=compress&cs=tinysrgb&w=630&h=375&dpr=2
  test_indices: []              # test images for "predict --split test", e.g. [0, 5, 12]; [] = the first num_test_images
  num_test_images: 8

output:
  dir: outputs
  show_plots: false

export:
  opset: 17
  atol: 1.0e-3                  # tolerance for ONNX Runtime vs PyTorch comparison

models:
  detr:
    name: facebook/detr-resnet-50
    inference_threshold: 0.45
    fp16: false                 # DETR's Hungarian/GIoU loss breaks under fp16
    use_nms: true
    nms_iou: 0.5
    # Image processor sizing, built from data.image_size:
    #   fixed_canvas -> size {max_height, max_width} + pad_size {height, width} (every image padded to a square)
    #   edges        -> size {shortest_edge, longest_edge} (padded to the largest image in the batch)
    resize_mode: fixed_canvas

  conditional_detr:
    name: microsoft/conditional-detr-resnet-50
    inference_threshold: 0.3
    fp16: true
    use_nms: false
    nms_iou: 0.5
    resize_mode: edges
